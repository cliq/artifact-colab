<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sprint Task List</title>
<style>
  :root {
    --accent: #2563eb;
    --border: #e2e8f0;
    --muted: #64748b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 20px;
    color: #0f172a;
  }
  .task-list {
    list-style: none;
    padding: 0;
    margin: 16px 0;
  }
  .task-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .task-list input[type="checkbox"] {
    accent-color: var(--accent);
  }
  footer.note {
    color: var(--muted);
    font-size: 13px;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <noscript>
    <h1>Sprint Task List</h1>
    <ul>
      <li>Design review</li>
      <li>API contract</li>
      <li>Load testing</li>
    </ul>
  </noscript>

  <p class="static-note" id="static-fallback-note">
    All estimates assume a two-week sprint cadence.
  </p>

  <div id="root"></div>

  <script>
    (function render() {
      const root = document.getElementById('root');

      const items = ['Design review', 'API contract', 'Load testing'];

      const itemsHtml = items
        .map(function (label) {
          return '<li><input type="checkbox"><span>' + label + '</span></li>';
        })
        .join('');

      root.innerHTML =
        '<h1>Sprint Task List</h1>' +
        '<ul class="task-list">' + itemsHtml + '</ul>' +
        '<footer class="note">All estimates assume a two-week sprint cadence.</footer>';
    })();
  </script>
</body>
</html>
